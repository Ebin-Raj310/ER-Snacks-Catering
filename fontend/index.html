<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER Snacks — Sign In</title>
    <meta name="description" content="Sign in to ER Snacks Catering and order your favourite snacks and meals.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../Css/login.css">
</head>

<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="loginTitle">
            <a href="../index.html" class="logo-link">ER Snacks</a>
            <h1 id="loginTitle">Login</h1>
            <p class="form-subtitle">Sign in to continue to ER Snacks.</p>

            <form id="loginForm" novalidate>
                <div class="field-group">
                    <label class="field-label" for="username">Email or Username</label>
                    <input type="text" id="username" name="username" class="field-input"
                        placeholder="Enter your email or username" autocomplete="username">
                    <span class="field-error" id="usernameError"></span>
                </div>

                <div class="field-group">
                    <div class="field-label-row">
                        <label class="field-label" for="password">Password</label>
                        <a href="#" class="field-forgot" id="forgotPassword">Forgot password?</a>
                    </div>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" class="field-input"
                            placeholder="Enter your password" autocomplete="current-password">
                        <button type="button" class="field-toggle" id="togglePassword">Show</button>
                    </div>
                    <span class="field-error" id="passwordError"></span>
                </div>

                <label class="checkbox-label" for="rememberMe">
                    <input type="checkbox" id="rememberMe" class="checkbox-input">
                    <span>Remember me</span>
                </label>

                <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
                <p class="login-message" id="loginMessage" role="alert"></p>
            </form>

            <p class="form-footer">Don't have an account? <a href="#">Create a Account</a></p>
        </section>
    </main>

    <script src="../fontend/script/script.js"></script>
</body>

</html>
